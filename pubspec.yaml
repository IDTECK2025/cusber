name: gold_pos
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  marquee: ^2.3.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  fl_chart: ^0.70.2
  bitsdojo_window: ^0.1.6
  file_picker: ^10.0.0
  printing: ^5.14.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  open_file: ^3.5.10
  animated_custom_dropdown: ^3.1.1
  dio: ^5.8.0+1
  flutter_phosphor_icons: ^0.0.1+6
  uicons: ^1.0.1
  uuid: ^4.5.1
  auto_size_text: ^3.0.0
  ionicons: ^0.2.2
  dropdown_button2: ^2.3.9
  pdf: ^3.11.3
  path_provider: ^2.1.5
  path: ^1.9.1
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/jellery.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/jellery.png"
    icon_size: 48
  image_path: "assets/images/jellery.png"


flutter:

  uses-material-design: true

  assets:
    - assets/images/ 
  